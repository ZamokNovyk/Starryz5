<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starryz5: Popularidad estudiantil</title>
    <meta name="description" content="Starryz5 permite a alumnos registrar institutos y votar democráticamente por estudiantes y profesores." />
    <meta name="theme-color" content="#eab308" />
    <link rel="icon" type="image/jpeg" href="https://pub-bc6c27157abc40bea1e3260a2cd65513.r2.dev/Logo/favicon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body class="bg-[#0a0a0a] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
